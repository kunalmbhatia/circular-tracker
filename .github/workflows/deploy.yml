name: Build and deploy Pages

# Deploys BOTH dashboards from one Pages site:
#   /       -> the zero-build dashboard (index.html at repo root)
#   /app/   -> the React build (web/), built fresh on every run
#
# Runs on your own pushes to main, and after every "Update circular data"
# run. That second trigger is required: GitHub deliberately does not start
# other workflows from commits pushed with the built-in GITHUB_TOKEN, so the
# data commits alone would never redeploy the site.
# Requires Pages source set to "GitHub Actions" in Settings → Pages.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update circular data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # after an update run, deploy the commit it just pushed

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web app dependencies
        working-directory: web
        run: npm ci

      - name: Build the React app
        working-directory: web
        run: npm run build

      - name: Assemble combined Pages output
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          mkdir -p _site/app
          cp -r web/dist/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
