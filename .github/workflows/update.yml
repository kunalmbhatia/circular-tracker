name: Update circular data

on:
  schedule:
    # Every 2 hours, at 17 minutes past (UTC). NSE's feed only holds about a
    # day of circulars, so daily runs could miss some. Runs with nothing new
    # make no commit (see HEARTBEAT_HOURS in scraper/main.py).
    # GitHub may delay or occasionally skip scheduled runs under load.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  # Also run straight away when the pipeline's code changes, so a fix takes
  # effect without anyone clicking "Run workflow". (Note: GitHub's "Re-run jobs"
  # button re-runs the OLD commit; use "Run workflow" to run the latest code.)
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/update.yml"]

# Never let two runs overlap (a scheduled run and a push-triggered one, say):
# the second waits for the first to finish.
concurrency:
  group: update-circular-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write     # to open/close the "needs attention" issue for the maintainer

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/main.py

      - name: Commit updated data if changed
        # Runs even when the pipeline step failed: a partial run still saves the
        # circulars it did classify. On a total outage the file is untouched,
        # so there is nothing to commit and the job stays red.
        if: always()
        run: |
          git config user.name "circular-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/circulars.json data/filtered.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update circular data ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Alert the maintainer, or clear the alert
        # One open issue at most. GitHub emails the repository owner when it opens.
        # It updates while the problem lasts and closes itself once the run is healthy.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Circular Tracker needs attention"
          OPEN=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          if [ -f health_alert.md ]; then
            if [ -n "$OPEN" ]; then gh issue edit "$OPEN" --body-file health_alert.md
            else gh issue create --title "$TITLE" --body-file health_alert.md; fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "Resolved automatically: the latest run was healthy."
          fi
